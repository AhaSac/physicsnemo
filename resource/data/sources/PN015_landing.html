 data-track-label="Springer Link"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-blue-50 hover:tw-bg-blue-100 tw-transition tw-block tw-w-full tw-text-center">Read the published version in<!-- --> <span class="tw-italic">Sports Engineering</span>  →</span></a></p></div><div class="tw-px-4 tw-border-t-2 tw-border-gray-100"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><div class="tw-py-2"><div class="tw-text-left"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Version <!-- -->1</h3><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-700">posted<!-- --> </p></div></div></div><div class="tw-pt-1"><div class="tw-pb-1"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-flex tw-justify-center tw-w-full tw-mb-2">You are reading this <!-- -->latest<!-- --> <!-- -->preprint<!-- --> version</span></p></div></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Abstract</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Aerodynamic drag dominates the resistive forces in many sports at racing speeds, and small athlete posture changes can produce practically meaningful changes in performance. Standard approaches like field testing, wind-tunnel testing and computational fluid dynamics can be reliable, but time-consuming. Recent advances in scientific machine learning have enabled surrogate models that predict flow quantities at a fraction of the computational cost of a full computational fluid dynamics simulation. However, most applications currently focus on industrial geometries, such as cars or airplanes, where the surface is morphed to generate large datasets for training. It remains unclear how well these methods transfer to athlete geometries where variability is dominated by articulated pose changes rather than smooth shape morphing. In this work, a dataset for cyclist aerodynamics is generated by combining 12 scanned athlete geometries with 20 postures per athlete. Simulations are performed for these 240 geometries, which are then used to train a state-of-the-art surrogate model. An investigation is made on the generalization of the model to an unseen geometry and the balance between number of positions and number of unique geometries in the dataset. The surrogate reproduces the drag area with good agreement, with all predictions within ±10 % and a mean absolute percentage error of 2.69 %. The results also indicate that increasing the number of unique athlete geometries improves performance more effectively than increasing the number of postures per athlete at fixed dataset size. These results support the feasibility of scalable surrogate models for flow over athletes, enabling posture screening and comparative assessment at interactive speeds. This may open up new workflows and new application areas of drag calculations in the domain of sports aerodynamics.</p></div></span></div><div class="tw-flex tw-flex-wrap tw-pb-3"><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">Computational fluid dynamics</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">machine learning</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">surrogate model</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">athlete posture</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">aerodynamics</span></p></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100"><div class="tw-flex tw-items-start tw-justify-between"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full tw-px-4"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Full Text</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4 <p>The Regional Committee for Medical and Health Research Ethics waives the requirement for ethical approval for studies examining normal exercises with healthy athletic participants. Therefore, the study was done in accordance with the institutional requirements and in line with the Declaration of Helsinki.</p></div></span></p></div></div></div></div></div><div class="tw-col-span-4 lg:tw-min-h-screen xl:tw-px-0"><div class="tw-bg-gray-50 md:tw-px-1.5 tw-max-w-reading tw-mx-auto lg:tw-bg-white lg:tw-sticky lg:tw-top-0 lg:tw-flex-1 lg:tw-h-screen lg:tw-overflow-y-scroll lg:tw-overflow-visible lg:tw-mx-0 lg:tw-px-0 lg:tw-max-w-none _rs-scrollbar"><div class="tw-flex tw-w-full lg:tw-justify-end"><div class="tw-pt-6 tw-pb-24 tw-w-full sm:tw-max-w-xl lg:tw-px-4 xl:tw-px-8"><div class="tw-hidden lg:tw-flex tw-pl-3 tw-justify-end"><div class="tw-pr-3"><div class="tw-relative tw-inline-block tw-text-left" data-headlessui-state=""><div><button class="tw-group tw-inline-flex tw-items-center tw-px-3 tw-py-2 tw-transition-all tw-border-2 tw-rounded-md tw-bg-white tw-border-gray-100 hover:tw-bg-gray-100 focus:tw-outline-none" id="headlessui-menu-button-:Rkqlm:" type="button" aria-haspopup="menu" aria-expanded="false" data-headlessui-state=""><svg xmlns="http://www.w3.org/2000/svg" class="tw-w-5 tw-h-5 tw-text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M16.6187 6.07577C17.6476 6.07404 18.4714 6.44992 19.09 7.20342C19.6858 7.97982 19.9846 8.89392 19.9864 9.94571C19.9879 10.8146 19.8292 11.6266 19.5103 12.3816C19.1915 13.1367 18.7925 13.8234 18.3134 14.4415C17.8114 15.0597 17.2864 15.5979 16.7385 16.0562C16.1676 16.5373 15.6424 16.9383 15.1628 17.2592C14.6832 17.603 14.2949 17.8552 13.998 18.0158C13.6781 18.1763 13.5296 18.2566 13.5525 18.2566L12.7619 17.1947C12.9675 17.1029 13.2416 16.9195 13.5841 16.6446C13.9266 16.3925 14.2691 16.0832 14.6114 15.7168C14.9309 15.3504 15.2161 14.9498 15.4668 14.5149C15.7177 14.1029 15.8427 13.7026 15.8421 13.3139C15.8 "suffix":""}],"badges":[],"createdAt":"2026-02-19 15:08:18","currentVersionCode":1,"declarations":"","doi":"10.21203/rs.3.rs-8917995/v1","doiUrl":"https://doi.org/10.21203/rs.3.rs-8917995/v1","draftVersion":[],"editorialEvents":[{"content":"https://doi.org/10.1007/s12283-026-00560-9","type":"published","date":"2026-08-03T16:24:58+00:00"}],"editorialNote":"","failedWorkflow":false,"files":[{"id":116991216,"identity":"002ef924-48e5-40f0-9504-1f6687619d50","added_by":"auto","created_at":"2026-08-10 17:10:54","extension":"pdf","order_by":1,"title":"","display":"","copyAsset":false,"role":"manuscript-pdf","size":991242,"visible":true,"origin":"","legend":"","description":"","filename":"rev0.pdf","url":"https://assets-eu.researchsquare.com/files/rs-8917995/v1_covered_091f2191-a75b-4578-ab5e-510c7b7f265c.pdf"}],"financialInterests":"\u003cp\u003eCompeting interest reported. The first author is a member of the editorial board of the journal and was not involved in the peer-review process. The authors are partially funded by NablaFlow AS, who develops the simulation platform used for the CFD simulations.\u003c/p\u003e\n\u003cp\u003eThe Regional Committee for Medical and Health Research Ethics waives the requirement for ethical approval for studies examining normal exercises with healthy athletic participants. Therefore, the study was done in accordance with the institutional requirements and in line with the Declaration of Helsinki.\u003c/p\u003e","formattedTitle":"Machine learning surrogate model for athlete aerodynamics with application to cycling","fulltext":[],"fulltextSource":"","fullText":"","funders":[],"hasAdminPriorityOnWorkflow":false,"hasManuscriptDocX":false,"hasOptedInToPreprint":true,"hasPassedJournalQc":"","hasAnyPriority":false,"hideJournal":true,"highlight":"","institution":"","isAcceptedByJournal":true,"isAuthorSuppliedPdf":true,"isDeskRejected":"","isHiddenFromSearch":false,"isInQc":false,"isInWorkflow":false,"isPdf":true,"isPdfUpToDate":true,"isWithdrawnOrRetracted":false,"journal":{"display":true,"email":"info@researchsquare.com","identity":"researchsquare","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":true,"externalIdentity":"","sideBox":"","snPcode":"","submissionUrl":"/submission","title":"Research Square","twitterHandle":"researchsquare","acdcEnabled":true,"dfaEnabled":false,"editorialSystem":"","reportingPortfolio":"","inReviewEnabled":false,"inReviewRevisionsEnabled":true},"keywords":"Computational fluid dynamics, machine learning, surrogate model, athlete posture, aerodynamics","lastPublishedDoi":"10.21203/rs.3.rs-8917995/v1","lastPublishedDoiUrl":"https://doi.org/10.21203/rs.3.rs-8917995/v1","license":{"name":"CC BY 4.0","url":"https://creativecommons.org/licenses/by/4.0/"},"manuscriptAbstract":"\u003cp\u003eAerodynamic drag dominates the resistive forces in many sports at racing speeds, and small athlete posture changes can produce practically meaningful changes in performance. Standard approaches like field testing, wind-tunnel testing and computational fluid dynamics can be reliable, but time-consuming. Recent advances in scientific machine learning have enabled surrogate models that predict flow quantities at a fraction of the computational cost of a full computational fluid dynamics simulation. However, most applications currently focus on industrial geometries, such as cars or airplanes, where the surface is morphed to generate large datasets for training. It remains unclear how well these methods transfer to athlete geometries where variability is dominated by articulated pose changes rather than smooth shape morphing. In this work, a dataset for cyclist aerodynamics is generated by combining 12 scanned athlete geometries with 20 postures per athlete. Simulations are performed for these 240 geometries, which are then used to train a state-of-the-art surrogate model. An investigation is made on the generalization of the model to an unseen geometry and the balance between number of positions and number of unique geometries in the dataset. The surrogate reproduces the drag area with good agreement, with all predictions within ±10 % and a mean absolute percentage error of 2.69 %. The results also indicate that increasing the number of unique athlete geometries improves performance more effectively than increasing the number of postures per athlete at fixed dataset size. These results support the feasibility of scalable surrogate models for flow over athletes, enabling posture screening and comparative assessment at interactive speeds. This may open up new workflows and new application areas of drag calculations in the domain of sports aerodynamics.\u003c/p\u003e","manuscriptTitle":"Machine learning surrogate model for athlete aerodynamics with application to cycling","msid":"","msnumber":"","nonDraftVersions":[{"code":1,"date":"2026-03-17 04:41:22","doi":"10.21203/rs.3.rs-8917995/v1","editorialEvents":[{"type":"communityComments","content":0}],"status":"published","journal":{"display":true,"email":"info@researchsquare.com","identity":"researchsquare","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":true,"externalIdentity":"","sideBox":"","snPcode":"","submissionUrl":"/submission","title":"Research Square","twitterHandle":"researchsquare","acdcEnabled":true,"dfaEnabled":false,"editorialSystem":"","reportingPortfolio":"","inReviewEnabled":false,"inReviewRevisionsEnabled":true}}],"origin":"","ownerIdentity":"dfbe3d99-34d9-4d7d-a658-62e6ba0133f0","owner":[],"postedDate":"March 17th, 2026","published":true,"recentEditorialEvents":[],"rejectedJournal":[],"revision":"","amendment":"","status":"posted","subjectAreas":[],"tags":[],"updatedAt":"2026-08-10T17:03:55+00:00","versionOfRecord":{"articleIdentity":"rs-8917995","link":"https://doi.org/10.1007/s12283-026-00560-9","journal":{"identity":"sports-engineering","isVorOnly":false,"title":"Sports Engineering"},"publishedOn":"2026-08-03 16:24:58","publishedOnDateReadable":"August 3rd, 2026"},"versionCreated
